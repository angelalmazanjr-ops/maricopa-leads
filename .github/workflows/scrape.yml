name: Scrape Maricopa Motivated Seller Leads

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & Publish Leads
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - run: git sparse-checkout disable || true
      - run: ls -la

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome and Xvfb
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - run: pip install requests beautifulsoup4 lxml dbfread selenium webdriver-manager

      - run: python scraper/fetch.py
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ":99"
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git add dashboard/records.json data/records.json data/*.csv || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "update leads" && git push; fi

  deploy-pages:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - id: deployment
        uses: actions/deploy-pages@v4
